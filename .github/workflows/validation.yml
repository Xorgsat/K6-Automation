name: "Framework Validation & Unit Tests"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: "Python & Config Validation"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Set up Python 3.9"
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: "Install Python Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Validate Workload & Threshold Configurations"
        run: |
          python -m python.cli validate-config

      - name: "Run Framework Unit Tests (pytest)"
        run: |
          pytest -v --junitxml=results/pytest-results.xml
