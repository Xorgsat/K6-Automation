name: performance-engineering-quickpizza

services:
  quickpizza:
    image: ghcr.io/grafana/quickpizza-local:0.15.30
    container_name: quickpizza
    labels:
      - "service.type=application"
      - "service.name=quickpizza"
    ports:
      - "3333:3333"
      - "3334:3334"
    environment:
      QUICKPIZZA_ENABLE_ALL_SERVICES: 1
      QUICKPIZZA_DB: postgres://postgres:postgres@quickpizza-db:5432/quickpizza_db?sslmode=disable
      QUICKPIZZA_OTLP_ENDPOINT: http://alloy:4318
      QUICKPIZZA_TRUST_CLIENT_TRACEID: 1
      QUICKPIZZA_OTEL_SERVICE_NAME: quickpizza
      QUICKPIZZA_OTEL_SERVICE_INSTANCE_ID: quickpizza
      QUICKPIZZA_DELAY_RECOMMENDATIONS_API_PIZZA_POST: "${QUICKPIZZA_DELAY_RECOMMENDATIONS_API_PIZZA_POST:-}"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=development,service.name=quickpizza,service.version=0.15.30"
      QUICKPIZZA_OTEL_INSTRUMENTATION_MODE: "sdk"
    depends_on:
      quickpizza-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - qp-network

  quickpizza-db:
    image: postgres:18.6
    container_name: quickpizza-db
    labels:
      - "service.type=database"
      - "service.name=quickpizza-db"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quickpizza_db
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    networks:
      - qp-network

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    labels:
      - "service.type=monitoring"
      - "service.name=prometheus"
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    command:
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --config.file=/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"
    networks:
      - qp-network

  grafana:
    image: grafana/grafana:13.0.1
    container_name: grafana
    labels:
      - "service.type=visualization"
      - "service.name=grafana"
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_FEATURE_TOGGLES_ENABLE=tempoAlerting
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana/dashboards/definitions:/etc/grafana/provisioning/dashboards/definitions:ro
    depends_on:
      - prometheus
    networks:
      - qp-network

  # Full observability profile services (optional)
  alloy:
    image: grafana/alloy:v1.20.0
    container_name: alloy
    profiles: ["full"]
    volumes:
      - ./monitoring/config.alloy:/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - /config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=public-preview
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    environment:
      QUICKPIZZA_HOST: quickpizza:3333
      METRICS_ENDPOINT: http://prometheus:9090/api/v1/write
      TRACES_ENDPOINT: http://tempo:4317
      LOGS_ENDPOINT: http://loki:3100/loki/api/v1/push
      PROFILES_ENDPOINT: http://pyroscope:4040
      DEPLOYMENT_ENVIRONMENT: development
      DB_O11Y_CONNECTION: "postgres://postgres:postgres@quickpizza-db:5432/quickpizza_db?sslmode=disable"
      SERVICE_NAMESPACE: quickpizza
      DB_SERVICE_NAME: quickpizza-db
    depends_on:
      - quickpizza
      - prometheus
      - tempo
      - loki
      - pyroscope
    networks:
      - qp-network

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    profiles: ["full"]
    ports:
      - "3100:3100"
    networks:
      - qp-network

  tempo:
    image: grafana/tempo:3.1.1
    container_name: tempo
    profiles: ["full"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./monitoring/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
    networks:
      - qp-network

  pyroscope:
    image: grafana/pyroscope:1.21.1
    container_name: pyroscope
    profiles: ["full"]
    ports:
      - "4040:4040"
    networks:
      - qp-network

volumes:
  postgres_data:

networks:
  qp-network:
    driver: bridge
